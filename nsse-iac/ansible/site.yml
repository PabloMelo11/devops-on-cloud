---
- name: Init Cluster
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - init-cluster
    - container-network

---
- name: Join Control Plane
  hosts: control_planes:!control_plane[0]
  become: true
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - join-control-planes