---
- name: Setting Up Cluster
  hosts: aws_ec2 # aws_ec2 seria todos os hosts
  become: true
  roles:
    - hostnames
    - dependency-packages
    - kube-packages
    - container-runtime
  # tasks:
  #   - name: Ping Control Plane
  #     ansible.builtin.ping:

---
- name: Init Cluster
  hosts: control_plane[0]
  become: true # become means to execute the tasks with elevated privileges (sudo)
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - init-cluster
    - set-provider-id
    - container-network

---
- name: Join Control Plane
  hosts: control_planes:!control_plane[0]
  become: true
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - join-control-planes
    - set-provider-id

---
- name: Join Workers
  hosts: workers
  become: true
  environment:
    KUBECONFIG: "{{ kube_config_worker }}"
  roles:
    - join-workers
    - set-provider-id

---
  - name: Update Launch Template
    hosts: localhost
    gather_facts: false
    roles:
      - update-launch-template

---
- name: Setting Up Cluster Auto Scaler
  hosts: control_plane[0]
  become: true # become means to execute the tasks with elevated privileges (sudo)
  environment:
    KUBECONFIG: "{{ kube_config }}"
  roles:
    - cloud-controller
    - node-termination
    - cluster-autoscaler
    - metrics-server
