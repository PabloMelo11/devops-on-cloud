---
- name: Adding Signing key for CRI-O
  apt_key:
    url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
    keyring: /etc/apt/keyrings/cri-o-apt-keyring.gpg

- name: Add CRI-O Repository
  apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v1.37/deb/ /
    state: present
