---
- name: Adding Public Signing Key for Kubernetes
  apt-key:
    url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes Repository
  apt_repository:
    repo: deb deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /
    state: present
